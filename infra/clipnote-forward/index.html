<!doctype html>
<!-- The old clipnote.web.app site: forwards every path to keeps.web.app (Firebase Hosting
     site IDs can't be renamed). Served for all paths via a rewrite, so /notes/x and
     /share?url=… keep their path and query. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keeps has moved</title>
    <script>
      location.replace("https://keeps.web.app" + location.pathname + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://keeps.web.app/" />
    <style>
      body { font: 16px -apple-system, system-ui, sans-serif; margin: 0; min-height: 100vh;
             display: grid; place-items: center; text-align: center; padding: 16px; }
      a { color: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <p>Clip Note is now Keeps.<br /><a href="https://keeps.web.app/">Open keeps.web.app</a></p>
  </body>
</html>
