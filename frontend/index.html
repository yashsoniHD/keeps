<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Set the theme class before first paint so a dark-mode user never sees a light flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("clipnote-theme");
          var dark =
            t === "dark" ||
            ((!t || t === "system") &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <title>Clipnote: your saves become tools</title>
    <meta
      name="description"
      content="Save anything — links, reels, products, places — and Clipnote turns it into a living collection you can watch, cook, visit, or buy from."
    />
    <meta property="og:title" content="Clipnote: your saves become tools" />
    <meta
      property="og:description"
      content="Save anything and it becomes an actionable collection — a watchlist, a wishlist, a recipe book, a map of places."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1F4BFF" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Fonts: Clash Display (Signal display face) via Fontshare + Inter (body) via Google. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
